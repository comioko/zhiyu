# Install as a separate site after checking existing Nginx server_name values.
# This server does not become the default server or replace another site.
server {
    listen 80;
    server_name 113.20.8.115;

    root /srv/zhiyu/frontend/current;
    index index.html;

    # Expose only the aggregate health result, not the Actuator namespace.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location ^~ /actuator {
        return 404;
    }

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        # No trailing URI: keep the original /api/... path for Spring Boot.
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # RAG question answering uses EventSource/SSE on the same origin.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ /\. {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite filenames contain content hashes. A missing asset must be a 404.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
