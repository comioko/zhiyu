# Install as /etc/systemd/system/zhiyu-backend.service.d/20-low-memory.conf.
# Optional 512 MiB trial only; use SPRING_PROFILES_ACTIVE=prod,lite.
[Service]
Environment="JAVA_OPTS=-Xms32m -Xmx144m -XX:+UseSerialGC -XX:ActiveProcessorCount=1 -Xss384k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=16m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"
MemoryAccounting=true
MemoryHigh=288M
MemoryMax=320M
MemorySwapMax=128M
Restart=on-failure
